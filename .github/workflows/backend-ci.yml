name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: harbinger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/harbinger_test
      TEST_DATABASE_URL: postgresql+psycopg://taskuser:taskpass@localhost:5432/harbinger_test
      SECRET_KEY: 162ecf3b6e3f97485697a823dee86d31b9821a9a4dd7d8753df2cecdd8365fe2
      ENVIRONMENT: test
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore