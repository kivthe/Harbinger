services:
  db:
    image: postgres:16
    container_name: harbinger-db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: harbinger
    ports:
      - "5432:5432"
    volumes:
      - harbinger_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d harbinger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harbinger-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://taskuser:taskpass@db:5432/harbinger
      TEST_DATABASE_URL: postgresql+psycopg://taskuser:taskpass@db:5432/harbinger_test
      SECRET_KEY: local-dev-secret-key-change-me-in-production
      ENVIRONMENT: development
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:5173
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-strong-password-123
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.create_admin &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  harbinger_pg: