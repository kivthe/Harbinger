server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Сжатие ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── SPA fallback: любой путь → index.html ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Долгий кэш для хэшированных ассетов ─────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Медиа (музыка, картинки) ────────────────────────
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Проксирование API на backend ────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Проксирование SQLAdmin ──────────────────────────
    location /admin {
        proxy_pass http://backend:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


location /docs {
    proxy_pass http://backend:8000/docs;
    proxy_set_header Host $host;
}
location /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    proxy_set_header Host $host;
}